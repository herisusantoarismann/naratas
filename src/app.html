<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<!-- Primary SEO Metadata -->
		<title>Naratas — Local-First Block Document Engine</title>
		<meta
			name="description"
			content="Naratas adalah editor dokumen berbasis blok super cepat dengan Svelte 5 Runes. Local-first, tanpa lag, slash commands instan, ekspor Markdown, dan cloud share Supabase."
		/>
		<meta
			name="keywords"
			content="block editor, notion alternative, markdown editor, local first, svelte 5, document engine, note taking, tech writing, naratas"
		/>
		<meta name="author" content="Heri Susanto Arisman" />
		<meta
			name="robots"
			content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
		/>

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Naratas" />
		<meta property="og:title" content="Naratas — Local-First Block Document Engine" />
		<meta
			property="og:description"
			content="Tulis draf dan dokumentasi secepat pikiran Anda. Local-first, tanpa lag, slash commands instan, dan ekspor Markdown."
		/>
		<meta property="og:image" content="/favicon.svg" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Naratas — Local-First Block Document Engine" />
		<meta
			name="twitter:description"
			content="Tulis draf dan dokumentasi secepat pikiran Anda. Local-first, tanpa lag, slash commands instan, dan ekspor Markdown."
		/>
		<meta name="twitter:image" content="/favicon.svg" />

		<!-- Web Performance & Icons -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#18181b" />

		<!-- Structured Data: Schema.org WebApplication -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Naratas",
				"url": "https://naratas.dev",
				"description": "Local-First Block Document Engine powered by Svelte 5 Runes.",
				"applicationCategory": "ProductivityApplication",
				"operatingSystem": "All",
				"browserRequirements": "Requires JavaScript. Requires HTML5.",
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD"
				},
				"author": {
					"@type": "Person",
					"name": "Heri Susanto Arisman"
				}
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
